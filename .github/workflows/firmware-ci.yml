name: AVR Firmware CI
on:
  push:
    branches: [develop, 'release/**']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  avr-build:
    name: AVR firmware build
    runs-on: ubuntu-latest
    env:
      GPM_SKETCH_PATH: "BlinkLedTest"
      GPM_FQBN: "arduino:avr:nano"
      GPM_CORE: "arduino:avr"
      GPM_CORE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - name: Locate sketch
        id: sketch
        shell: bash
        run: |
          if [[ ! -d "$GPM_SKETCH_PATH" ]]; then
            echo "Sketch directory not found: $GPM_SKETCH_PATH" >&2
            exit 1
          fi
          mapfile -t sketches < <(find "$GPM_SKETCH_PATH" -maxdepth 1 -type f -name '*.ino')
          if (( ${#sketches[@]} == 0 )); then
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'No .ino sketch on this branch; firmware compilation deferred'
          else
            echo 'present=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: arduino/setup-arduino-cli@v2
        if: steps.sketch.outputs.present == 'true'
      - name: Install board core
        if: steps.sketch.outputs.present == 'true'
        shell: bash
        run: |
          if [[ -n "$GPM_CORE_URL" ]]; then
            arduino-cli core update-index --additional-urls "$GPM_CORE_URL"
            arduino-cli core install "$GPM_CORE" --additional-urls "$GPM_CORE_URL"
          else
            arduino-cli core update-index
            arduino-cli core install "$GPM_CORE"
          fi
      - name: Generate CI version header
        if: steps.sketch.outputs.present == 'true'
        shell: bash
        run: |
          VERSION=XXXXXXX
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" == release/* ]]; then
            VERSION="$(git rev-parse --short=7 HEAD)"
          fi
          printf '#pragma once\n#define GIT_VERSION "%s"\n' "$VERSION" > "$GPM_SKETCH_PATH/GitVersion.generated.h"
      - name: Compile AVR firmware
        if: steps.sketch.outputs.present == 'true'
        run: arduino-cli compile --fqbn "$GPM_FQBN" "$GPM_SKETCH_PATH"
